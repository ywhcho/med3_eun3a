{% extends 'base.html' %}

{% block title %}프로필 수정{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">프로필 수정</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">사용자명</label>
                        <input type="text" class="form-control" id="username" value="{{ user.username }}" disabled>
                        <div class="form-text">사용자명은 변경할 수 없습니다.</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
                    </div>
                    <hr class="my-4">
                    <h5>비밀번호 변경 (선택)</h5>
                    <div class="mb-3">
                        <label for="password1" class="form-label">새 비밀번호</label>
                        <input type="password" class="form-control" id="password1" name="password1">
                        <div class="form-text">변경하지 않으려면 비워두세요.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">새 비밀번호 확인</label>
                        <input type="password" class="form-control" id="password2" name="password2">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">취소</a>
                        <button type="submit" class="btn btn-primary">수정하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
