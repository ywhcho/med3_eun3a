{% extends 'base.html' %}

{% block title %}프로필{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">프로필</h2>
                <table class="table table-bordered">
                    <tbody>
                        <tr>
                            <th style="width: 30%;" class="table-light">사용자명</th>
                            <td>{{ user.username }}</td>
                        </tr>
                        <tr>
                            <th class="table-light">이메일</th>
                            <td>{{ user.email|default:"미등록" }}</td>
                        </tr>
                        <tr>
                            <th class="table-light">가입일</th>
                            <td>{{ user.date_joined|date:"Y년 m월 d일" }}</td>
                        </tr>
                        <tr>
                            <th class="table-light">마지막 로그인</th>
                            <td>{{ user.last_login|date:"Y년 m월 d일 H:i" }}</td>
                        </tr>
                    </tbody>
                </table>
                <div class="text-end">
                    <a href="{% url 'accounts:profile_update' %}" class="btn btn-primary">프로필 수정</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
