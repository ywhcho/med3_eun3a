{% extends 'base.html' %}

{% block title %}{% if form_type == 'create' %}글쓰기{% else %}글수정{% endif %} - 게시판{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2>{% if form_type == 'create' %}글쓰기{% else %}글수정{% endif %}</h2>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-12">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" class="form-control" id="title" name="title" 
                       value="{% if post %}{{ post.title }}{% endif %}" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea class="form-control" id="content" name="content" rows="10" required>{% if post %}{{ post.content }}{% endif %}</textarea>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{% if post %}{% url 'board:detail' post.pk %}{% else %}{% url 'board:list' %}{% endif %}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary">{% if form_type == 'create' %}작성{% else %}수정{% endif %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
