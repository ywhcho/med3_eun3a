{% extends 'base.html' %}

{% block title %}게시글 삭제 - 게시판{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2>게시글 삭제</h2>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <p class="mb-4">정말로 이 게시글을 삭제하시겠습니까?</p>
                <div class="alert alert-warning">
                    <strong>제목:</strong> {{ post.title }}<br>
                    <strong>작성자:</strong> {{ post.author.username }}<br>
                    <strong>작성일:</strong> {{ post.created_at|date:"Y-m-d H:i" }}
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'board:detail' post.pk %}" class="btn btn-secondary">취소</a>
                        <button type="submit" class="btn btn-danger">삭제</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
